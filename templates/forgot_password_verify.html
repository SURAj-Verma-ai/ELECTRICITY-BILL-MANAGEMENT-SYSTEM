<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - EBMS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <div class="auth-card">
        <h1>Answer your security questions</h1>
        <p class="subtitle">Step 2 of 3: prove it's really you</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.forgot_password_verify') }}">
            {% for question in questions %}
            <div class="field">
                <label for="answer_{{ question.id }}">{{ question.text }}</label>
                <input type="text" id="answer_{{ question.id }}" name="answer_{{ question.id }}"
                       maxlength="100" required autocomplete="off">
            </div>
            {% endfor %}

            <button type="submit" class="submit-btn">Verify</button>
        </form>

        <div class="auth-footer">
            <a href="{{ url_for('auth.login') }}">Back to log in</a>
        </div>
    </div>
</body>
</html>
