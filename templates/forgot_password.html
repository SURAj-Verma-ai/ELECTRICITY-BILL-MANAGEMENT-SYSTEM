<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - EBMS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <div class="auth-card">
        <h1>Forgot your password?</h1>
        <p class="subtitle">Step 1 of 3: tell us who you are</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.forgot_password') }}">
            <div class="field">
                <label for="identifier">Username or email</label>
                <input type="text" id="identifier" name="identifier" value="{{ identifier }}"
                       required autocomplete="username">
            </div>

            <button type="submit" class="submit-btn">Continue</button>
        </form>

        <div class="auth-footer">
            <a href="{{ url_for('auth.login') }}">Back to log in</a>
        </div>
    </div>
</body>
</html>
