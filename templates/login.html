<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EBMS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="subtitle">Log in to EBMS</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="field">
                <label for="identifier">Username or email</label>
                <input type="text" id="identifier" name="identifier" value="{{ identifier }}"
                       required autocomplete="username">
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       required autocomplete="current-password">
                <div class="hint"><a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a></div>
            </div>

            <button type="submit" class="submit-btn">Log in</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
